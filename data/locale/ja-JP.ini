PreviewHelpDetail="<b>録音</b><br>OBSの最終ミックスを3秒の準備後から最長30秒間録音します。配信前の確認に使い、出力デバイスを選んで「録音する」を押し、確認したい音を入れたら「録音を終了」を押してください。<br><br><b>試聴</b><br>録音終了の3秒後に自動で試聴し、「もう一度聴く」で同じ音声を再生します。準備が間に合わないときは「自動試聴を止める」を押し、準備後に「試聴する」を押してください。<br><br><b>試聴前に外部アプリの音と発声・演奏を止めてください。配信・録画・リプレイバッファの停止中に使います。</b><br><br><b>録音する音声</b><br>通常、配信に使う音声を自動選択し、手動指定の番号は「音声の詳細プロパティ」のトラック1〜6に対応します。音源の組み合わせをトラックごとに変えている場合や配信で複数の音声を使う場合に、チェックを入れて対象を指定してください。<br><br><b>出力デバイス</b><br>試聴音を出す機器を選び、「OS既定の出力デバイス」では試聴開始時の既定出力を使います。接続した機器が一覧にないときは「出力デバイスを更新」を押してください。<br><br><b>OBSのモニタリング</b><br>チェックを入れると試聴中だけOBS標準モニターをOFFにし、終了・停止・エラー時にプラグインが変更した設定を戻します。音の重なりを防ぐため通常はチェックを入れ、意図して両方を聴く場合だけ外してください。<br><br><b>配信音、外部アプリの直接音、機器の直接モニターはミュートしません。</b><br><br><b>録音と設定の保存</b><br>録音をメモリに1件だけ保持してOBS終了時に破棄し、選択設定を正常終了時に保存します。音声や解析対象の設定を変えて確認するときは「録り直す」で録音を置き換えてください。"
SectionHelp="%1のヘルプを開く"
HelpMeters="このモニタは、選択した声・BGMの音量と、両者から計算したミックスの音量を表示します。録音する前に、入力中の音量と声の聞き取りやすさを確認するときに使います。<br><br>計測には3秒のShort-term LUFSを使います。録音モニタとは測定時間や音声処理が異なるため、同じ音源でも数値が一致しない場合があります。"
HelpSettings="<b>検出しきい値</b><br>声として扱う入力レベルで、値を下げると小さい声と環境音を含みやすくなります。現在の入力と録音解析で発声を検出するために調整してください。<br><br><b>目標バランス</b><br>BGMに対する声の音量差の目標で、大きくすると声をより強調する判定になります。現在の入力と録音結果のバランス評価を、目指す聞こえ方に合わせるために使います。<br><br>ミックス基準<br>ミックス基準は、声とBGMを合わせた音量を評価するための目安です。リアルタイムモニタと録音モニタの評価を、目指す音量に合わせるときに使います。<br><br>このプラグインにはOBSの音量を自動調整する機能がありません。変更した設定で録音音声を評価するには、録り直してください。"

