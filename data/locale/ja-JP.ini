GuideBody="<p>このプラグインは、声とBGMのバランスを数値と試聴で確認するためのツールです。配信前に声の聞こえやすさや音割れのおそれを確認するときに使ってください。</p><ul><li>リアルタイムモニタでは、現在OBSに入力されている音声の状態を表示します。</li><li>録音モニタでは、プラグイン内の録音ボタンを押して録音した音声について、瞬時値と録音全体の状態を表示します。</li></ul><p>※両機能ともに、計算対象となるのはソース選択で指定された声とBGMです。</p><h3>用語</h3><ul><li>モニタリングとは、音声を聴いて状態を確認することです。OBS標準モニターと、このプラグインによる録音音声の試聴は別の再生経路です。</li><li>ラウドネスとは、人が感じる音の大きさを表す尺度です。このプラグインではLUFSという単位で表示します。</li><li>BGMとは、声の背景で流す音楽です。このプラグインでは、ソース選択のBGM欄で指定する音声をまとめてBGMとして扱います。</li><li>ミックスとは、複数の音声を合わせた音声です。このプラグインの数値表示にあるミックスは、ソース選択で指定する声とBGMを合わせた音声を指します。</li><li>最終ミックスとは、OBSが各ソースの音声を合わせ、出力用にまとめた音声です。このプラグインは、その音声を録音して試聴に使います。</li><li>ピークレベルとは、音声信号の瞬間的な強さを示す値です。このプラグインではdBで表示し、音割れのおそれを表示するクリップ評価にも使います。</li><li>クリッピングとは、音声信号が扱える上限を超え、波形が切り詰められる現象です。クリッピングが生じると『バリバリ』のような音割れが聞こえる場合があります。</li><li>LUとは、ラウドネスの差を表す単位です。このプラグインは、声とBGMのラウドネスの差をLUで表示します。</li></ul>"
GuideTitle="使い方・用語ガイド"
