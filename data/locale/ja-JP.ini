HelpUnits="LUFSは音の大きさ、dBはデジタル音声の最大振幅を基準としたピーク、LUは声とBGMの音量差を示します。音量の大きさ、過大入力、声の聞き取りやすさを分けて確認するときに使います。"

PreviewInstantHelp="瞬時値は、試聴位置に対応する声・BGM・ミックスの音量とピークを表示します。聴こえる音と数値の変化を照らし合わせるときに使います。<br><br>LUFSには直前400msのMomentary値、ピークには各100ms区間の最大値を使います。冒頭400msのLUFSと、試聴停止中の瞬時値は未評価になります。"

PreviewWholeHelp="録音全体には、発声区間の平均LUFSと、録音中の最大ピークを表示します。録音の全体的な音量バランスと、短い過大入力を確認するときに使います。<br><br>平均は録音開始3秒以後のShort-term値を100msごとに集計する算術平均で、Integrated LUFSではありません。声とBGMの平均には両方を計測できた同じ発声時点を使い、ミックスの平均にはそのうちミックスも計測できた時点を使います。<br><br>3秒未満の録音では平均LUFSを表示できません。最大ピークとクリップ評価は、平均LUFSの成立とは別に表示します。"
