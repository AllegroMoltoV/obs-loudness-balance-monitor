Help="ヘルプ"
HelpUsage="<b>メーターで確認する音源</b><br>声ソースにマイクを選び、BGMソースに対象の音源をチェックします。ソースが追加された場合は「ソース更新」で一覧を更新します。<br><br>この選択はステータスとメーター用です。「録音・試聴」ではOBSの選択トラックの最終ミックスを録音します。選択設定は正常終了後も保持されます。"
HelpBalance="<b>バランス</b><br>声とBGMの音量差を目標バランスと比較します。緑は目標以上、黄は目標より小さめ、赤は声が埋もれる可能性を示します。数値の目標は「設定」で変更できます。"
HelpMix="<b>ミックス</b><br>選択した声とBGMの音量を、設定したミックス基準と比較します。緑は基準以上、黄はやや小さめ、赤は小さすぎる目安です。最終ミックスの試聴とは別に、現在の入力を評価します。"
HelpClip="<b>クリップ</b><br>選択した入力のピークを確認します。緑は-1 dBFS未満、黄は-1〜0 dBFS、赤は0 dBFS以上です。赤の場合は入力レベルを下げて音割れを確認してください。"

