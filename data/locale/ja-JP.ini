PreviewReplay="もう一度聴く"
PreviewMonitorActive="試聴中はOBS標準モニターの自動OFFが有効です。終了時にプラグインが変更した設定を戻します。"
PreviewMonitorHelp="通常はチェックを入れます。OBS標準モニターと試聴音の重なりを防ぎ、試聴終了・停止・エラーで元へ戻します。意図して両方を聴く場合だけ外してください。配信音や外部アプリの音はミュートしません。"
PreviewHelpDetail="<b>配信前の録音チェック</b><br>1. 出力デバイスを選び、「録音する」を押します。<br>2. 3秒後から普段の声とBGMを録音します。「録音を終了」で確定します。最長30秒です。<br>3. 録音終了後、外部アプリの音と発声・演奏を止めてください。3秒の準備後に自動で試聴します。間に合わない場合は「自動試聴を止める」を押し、準備してから「試聴する」を押します。<br>4. 「もう一度聴く」で同じ音声を再生し、「録り直す」で前の録音を置き換えます。<br><br><b>録音する音声</b><br>通常はOBSの配信設定からトラックを自動選択します。別のトラックを聴く場合はチェックを入れて番号を選びます。番号は「音声の詳細プロパティ」のトラック1〜6と同じです。メーター用の声・BGM選択とは別の設定です。<br><br><b>OBS標準モニタリング</b><br>通常は「試聴中はOBS側のモニタリングをOFF」にチェックを入れます。試聴音との重なりを防ぎ、終了・停止・エラーで元へ戻します。意図して両方を聴く場合だけ外してください。配信音、外部アプリの直接音、機器の直接モニターはミュートしません。<br><br>配信・録画・リプレイバッファの停止中に使います。メーターは常に現在の入力を表示します。録音はメモリに1件だけ保持し、OBS終了時に破棄します。選択設定は正常終了時に保存します。"
SectionHelp="%1のヘルプを開く"
HelpMeters="<b>現在の入力</b><br>声・BGM・両者のミックスの音量を表示します。LUFSは感じる音の大きさ、dBはピーク、LUは声とBGMの差の目安です。音声検出が点灯している間に声とミックスを評価します。<br><br>録音した音声の再生位置やレベルではありません。録音・試聴の対象トラックとは別に、ソース選択で指定した入力を表示します。"
HelpSettings="<b>検出しきい値</b><br>声として扱う入力レベルです。値を下げると小さい声も検出しやすくなりますが、環境音も含みやすくなります。<br><br><b>目標バランス</b><br>BGMに対する声の音量差の目標です。大きくすると声をより強調する判定になります。<br><br><b>ミックス基準</b><br>全体の音量判定に使う目安を選びます。これらは判定基準であり、OBSの音量を自動調整する設定ではありません。"
