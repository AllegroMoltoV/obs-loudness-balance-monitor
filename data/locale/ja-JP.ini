PreviewHelpDetail="<p>録音モニタでは、OBSがYouTubeなどに出力する最終ミックスを録音し、試聴できます。試聴時には、声・BGM・ミックスのラウドネスとピークレベルが表示されます。録音モニタが表示するのは、瞬時値と録音全体の2種類です。瞬時値では、試聴しているその瞬間の時間の値をもとに計算します。一方で、録音全体では、録った時間全体から計算します(厳密には、発声中の平均ラウドネスと、録音中の最大ピークレベル)。</p><p>なお、バランス・ミックス・クリップの評価項目はリアルタイムモニタと共通です。配信前に録音してみて、OBSの音量設定を見直す際の参考にしてください。</p><h3>使い方</h3><p>試聴に使う出力デバイスを選び、「録音する」を押してください。確認したい音声を録音したら、「録音を終了」を押してください。録音終了の3秒後に自動で試聴が始まります。外部アプリで音を再生している場合は、試聴時にはミュートにするのをおすすめします。</p><p>ちなみに「試聴中はOBS側のモニタリングをOFF」にチェックを入れれば、試聴中だけOBS側で再生されている音(厳密には、OBS標準モニタリング)はOFFになります。音の重なりを防ぐために通常はチェックを入れ、両方の音を同時に聴きたい場合だけ外してください。</p><p>※配信・録画・リプレイバッファを停止してから使ってください。ソースの選択や評価基準を変更した結果を確認するには、録り直してください。</p>"
SectionHelp="%1のヘルプを開く"
HelpMeters="<p>リアルタイムモニタでは、ソース選択で指定した声・BGM・ミックスのラウドネスとピークレベルを表示し、バランス・ミックス・クリップの3項目で評価します。OBSの音量設定を見直す際の参考にしてください。</p><p>バランスは、声とBGMのラウドネスの差を、設定の「目標バランス」と比較した結果です。</p><table width='100%' cellspacing='0' cellpadding='3' border='1'><tr><th>ラウドネス差 x [LU]</th><th>Perfect</th><th>Good</th><th>Bad</th></tr><tr><td>声 − BGM</td><td>x ≥ T</td><td>T − 3 ≤ x &lt; T</td><td>x &lt; T − 3</td></tr></table><p>※ T: 設定の「目標バランス」の値 [LU]</p><p>ミックスは、選択した声とBGMを合わせたラウドネスの評価です。</p><table width='100%' cellspacing='0' cellpadding='3' border='1'><tr><th>ミックス基準 / x [LUFS]</th><th>Perfect</th><th>Good</th><th>Bad</th></tr><tr><td>YouTube標準</td><td>x ≥ −18</td><td>−22 ≤ x &lt; −18</td><td>x &lt; −22</td></tr><tr><td>小さめ安全</td><td>x ≥ −20</td><td>−24 ≤ x &lt; −20</td><td>x &lt; −24</td></tr><tr><td>大きめ攻め</td><td>x ≥ −16</td><td>−20 ≤ x &lt; −16</td><td>x &lt; −20</td></tr></table><p>クリップは、声・BGM・ミックスのうち最も高いピークレベルに基づく、音割れのおそれの評価です。</p><table width='100%' cellspacing='0' cellpadding='3' border='1'><tr><th>最大ピーク x [dBFS]</th><th>Perfect</th><th>Good</th><th>Bad</th></tr><tr><td>声・BGM・ミックスの最大値</td><td>x &lt; −1</td><td>−1 ≤ x &lt; 0</td><td>x ≥ 0</td></tr></table>"
HelpSettings="<p>設定では、声の検出基準と、バランス・ミックスの評価基準を変更できます。声の検出状況や目指す聞こえ方に合わせて、各項目を調整してください。</p><ul><li>検出しきい値は、このプラグインが発声中と判定する入力レベルの基準です。小さい声を検出させたい場合は値を下げ、環境音を声として検出する場合は値を上げてください。</li><li>目標バランスは、声とBGMのラウドネスの差の目標です。BGMより声を強調する評価基準にしたい場合は値を大きくしてください。</li><li>ミックス基準は、声とBGMを合わせたラウドネスの評価基準です。配信で目指す聞こえ方に合わせて選んでください。</li></ul><p>※このプラグインは、OBSの音量を自動調整しません。音量を変えるときはOBS側で調整してください。</p>"

