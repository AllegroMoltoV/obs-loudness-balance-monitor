Help="ヘルプ"
HelpUsage="<b>声とBGMの選択</b><br>ここで選んだ音源を、リアルタイムモニタと録音モニタの解析に使います。音量バランスを確認するため、声にマイクを選び、BGMに対象の音源をチェックしてください。<br><br><b>一覧と保存</b><br>「ソース更新」でOBSの音源一覧を読み直し、選択設定を正常終了時に保存します。音源を追加したときに一覧を更新してください。<br><br><b>試聴する音声はOBSの選択トラックの最終ミックスです。解析対象の選択を変えたら録り直してください。</b>"
HelpBalance="バランス評価は、声とBGMの音量差を設定した目標と比較します。声の聞き取りやすさを確認するときに使います。<br><br>緑は目標以上、黄は目標より3 LU以内の不足、赤はそれより大きい不足の目安です。変動する値の評価には、色の頻繁な切り替わりを抑える処理を使います。"
HelpMix="ミックス評価は、選択した声とBGMから計算した音量を「ミックス基準」と比較します。声とBGMを合わせた音量を確認するときに使います。<br><br>録音モニタのミックスは、選択した声とBGMを合成した音声です。試聴する最終ミックスに別の音源が含まれていても、その音源をこの評価には含めません。"
HelpClip="クリップ評価は、声・BGM・ミックスのうち最も高いピークを基に、過大入力の目安を示します。音割れの原因になりうるレベルを確認するときに使います。<br><br>ピークが−1 dBFS未満なら緑、−1 dBFS以上0 dBFS未満なら黄、0 dBFS以上なら赤です。録音全体の評価には、発声していない区間も含めた最大ピークを使います。"

