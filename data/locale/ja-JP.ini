PreviewAnalysisHelp="<b>リアルタイム</b><br>試聴位置までの400msの音量をMomentary LUFSで表示します。試聴する音と声・BGMの音量変化を照らし合わせるときに使います。<br><br><b>平均</b><br>声とBGMの両方を計測できた発声中の同じ時点で、100msごとのShort-term LUFS（過去3秒の音量）を算術平均します。録音全体の声とBGMのバランスを確認するときに使います。<br><br><b>評価</b><br>バランスの色は設定した目標との差を示し、声やBGMそれぞれの絶対音量の良否を示すものではありません。リアルタイムと平均を、声の聞き取りやすさの確認に使ってください。<br><br><b>平均はIntegrated LUFSではありません。測定に必要な音声が揃わない場合は未評価を表示します。</b>"
