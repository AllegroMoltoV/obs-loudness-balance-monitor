Help="ヘルプ"
HelpUsage="<b>声とBGMの選択</b><br>ここで選んだ音源を、現在の入力メーターと録音した声・BGMの解析に使います。音量バランスを確認するため、声にマイクを選び、BGMに対象の音源をチェックしてください。<br><br><b>一覧と保存</b><br>「ソース更新」でOBSの音源一覧を読み直し、選択設定を正常終了時に保存します。音源を追加したときに一覧を更新してください。<br><br><b>試聴する音声はOBSの選択トラックの最終ミックスです。解析対象の選択を変えたら録り直してください。</b>"
HelpBalance="<b>バランス</b><br>声とBGMの音量差を目標と比較し、緑は目標以上、黄は目標より小さめ、赤は声が埋もれる可能性を示します。声の聞き取りやすさを確認するときに使い、目標の音量差を「設定」で変更してください。"
HelpMix="<b>ミックス</b><br>選択した声とBGMの音量を基準と比較し、緑は基準以上、黄はやや小さめ、赤は小さすぎる目安を示します。現在の入力全体の音量を確認するときに使います。"
HelpClip="<b>クリップ</b><br>選択した入力のピークを示し、緑は-1 dBFS未満、黄は-1〜0 dBFS、赤は0 dBFS以上です。音割れの確認に使い、赤の場合は入力レベルを下げて聴き直してください。"

