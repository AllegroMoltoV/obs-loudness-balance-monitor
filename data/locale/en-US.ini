GuideTitle="Usage and terminology guide"
GuideBody="<p>This plugin helps you check the balance between voice and BGM through measurements and listening. Use it before streaming to check voice clarity and the risk of audio distortion.</p><ul><li>The live monitor displays the current state of audio entering OBS.</li><li>The recorded monitor displays instantaneous values and whole-recording results for audio captured using the plugin's Record button.</li></ul><p>Both features calculate results for the voice and BGM specified in Source selection.</p><h3>Terminology</h3><ul><li>Monitoring means listening to audio to check its state. Standard OBS monitoring and this plugin's recorded audio preview use separate playback paths.</li><li>Loudness is a measure of how loud audio sounds to people. This plugin displays it in LUFS.</li><li>BGM is music played in the background of speech. This plugin treats all audio specified in the BGM field of Source selection as BGM.</li><li>A mix is audio formed by combining multiple audio signals. In this plugin's measurements, Mix means the combined voice and BGM specified in Source selection.</li><li>The final mix is the audio OBS produces by combining its sources for output. This plugin records that audio for preview.</li><li>Peak level measures the instantaneous strength of an audio signal. This plugin displays it in dB and uses it for the Clip rating, which indicates the risk of audio distortion.</li><li>Clipping occurs when an audio signal exceeds the supported limit and its waveform is cut off. Clipping may cause audible crackling or other distortion.</li><li>LU is a unit of loudness difference. This plugin displays the loudness difference between voice and BGM in LU.</li></ul>"
