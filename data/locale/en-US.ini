PreviewHelpDetail="<p>The recorded monitor records and previews the final mix that OBS outputs to services such as YouTube. During preview, it displays loudness and peak levels for voice, BGM, and their mix. The recorded monitor provides two types of results: instantaneous values and whole-recording results. Instantaneous values are calculated from the values at the moment you are hearing. Whole-recording results are calculated from the entire recorded duration (more precisely, average loudness during speech and maximum peak levels during recording).</p><p>The Balance, Mix, and Clip ratings are shared with the live monitor. Make a recording before streaming and use the results when reviewing your OBS volume settings.</p><h3>How to use</h3><p>Select an output device for preview and press Record. Once you have recorded the audio you want to check, press Finish recording. Preview starts automatically 3 seconds after recording ends. If an external app is playing audio, we recommend muting it during preview.</p><p>Checking Turn OFF OBS monitoring during preview turns OFF audio played by OBS only during preview (more precisely, standard OBS monitoring). Normally leave it checked to prevent overlapping audio, and uncheck it only when you want to hear both at once.</p><p>Stop streaming, recording, and the replay buffer before using this feature. Record again to check the results after changing your source selections or rating criteria.</p>"
SectionHelp="Open help for %1"
HelpMeters="<p>After you specify voice and BGM sources in Source selection, the monitor displays loudness and peak levels for voice, BGM, and their mix, along with the risk of audio distortion. It provides three ratings: Balance, Mix, and Clip. Balance displays the comparison between the voice-to-BGM loudness difference and your target. Mix displays the comparison between the combined voice and BGM loudness and your reference. Clip displays the risk of audio distortion based on the peak levels of voice, BGM, and their mix. Refer to these results when reviewing your OBS volume settings.</p>"
HelpSettings="<p>Settings lets you change the voice detection threshold and the criteria for Balance and Mix ratings. Adjust each setting to match voice detection and your intended sound.</p><ul><li>VAD Threshold is the input level this plugin uses to detect speech. Lower it to detect quieter voices, or raise it if background noise is being detected as voice.</li><li>Balance Target is the target loudness difference between voice and BGM. Increase it if you want the rating criteria to call for more prominent voice relative to BGM.</li><li>Mix reference is the reference used to rate the combined voice and BGM loudness. Select it to match the sound you want for your stream.</li></ul><p>This plugin does not automatically adjust OBS volume. Adjust the volume in OBS when you want to change it.</p>"

