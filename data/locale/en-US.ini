HelpUnits="LUFS indicates loudness, dB indicates the peak relative to digital full scale, and LU indicates the voice-to-BGM loudness difference. Use these values to check loudness, excessive levels, and voice clarity separately."

PreviewInstantHelp="Instantaneous values show voice, BGM, and mix loudness and peaks at the playback position. Use them to compare the sound you hear with changing values.<br><br>LUFS uses the preceding 400 ms Momentary window; peaks use the maximum in each 100 ms interval. LUFS is unavailable during the first 400 ms, and instantaneous values are unavailable while playback is stopped."

PreviewWholeHelp="Whole recording shows average LUFS during speech and the maximum peaks in the recording. Use it to check the overall balance and brief excessive levels.<br><br>The average is an arithmetic mean of Short-term values sampled every 100 ms after the first 3 seconds; it is not Integrated LUFS. Voice and BGM use the same speech-active instants where both can be measured; the mix uses those instants where it can also be measured.<br><br>Average LUFS is unavailable for recordings shorter than 3 seconds. Maximum peaks and the clip rating are shown independently of average LUFS."
