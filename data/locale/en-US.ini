Help="Help"
HelpUsage="<b>Voice and BGM sources</b><br>Selected sources are used for live input meters and recorded voice/BGM analysis. To check the balance, select your microphone as Voice and check the BGM sources.<br><br><b>List and saved selections</b><br>Refresh Sources reloads the OBS source list, and selections are saved on normal shutdown. Refresh the list after adding a source.<br><br><b>Preview plays the final mix of the selected OBS track. Record again after changing the sources used for analysis.</b>"
HelpBalance="<b>Balance</b><br>Compares the voice-to-BGM difference with the target: green meets it, yellow is below it, and red indicates that voice may be buried. Use this to check voice clarity and change the target difference in Settings."
HelpMix="<b>Mix</b><br>Compares selected voice and BGM loudness with the reference: green meets it, yellow is slightly quiet, and red is too quiet. Use this to check the overall live input level."
HelpClip="<b>Clip</b><br>Shows selected input peaks: green is below -1 dBFS, yellow is -1 to 0 dBFS, and red is 0 dBFS or higher. Use this to check for distortion; if red, lower the input level and listen again."

