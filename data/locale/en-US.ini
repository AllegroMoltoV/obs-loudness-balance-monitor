PreviewHelpDetail="<b>Recording</b><br>Records the OBS final mix for up to 30 seconds after a 3-second preparation period. To check audio before streaming, select an output device, press Record, and press Finish recording once you have captured the audio to check.<br><br><b>Preview</b><br>Preview starts automatically 3 seconds after recording ends, and Listen again replays the same audio. If you need more time, press Stop automatic preview and then press Preview when ready.<br><br><b>Stop external app audio and finish speaking or playing before previewing. Use this while streaming, recording, and the replay buffer are stopped.</b><br><br><b>Audio to record</b><br>Streaming audio is normally selected automatically, and manual track numbers match tracks 1–6 in Advanced Audio Properties. Enable manual selection when using different source combinations per track or multiple streaming audio tracks.<br><br><b>Output device</b><br>Selects the device that plays the preview; OS default output device uses the default resolved when preview starts. Refresh output devices if a connected device is missing from the list.<br><br><b>OBS monitoring</b><br>When checked, turns OFF standard OBS monitoring during preview and restores settings changed by the plugin after completion, stop, or error. Normally leave it checked to prevent overlap, and uncheck only to intentionally hear both.<br><br><b>Streaming audio, external app audio, and hardware direct monitoring are not muted.</b><br><br><b>Recording and saved settings</b><br>Keeps one recording in memory until OBS closes and saves selections on normal shutdown. Use Record again to replace the recording after changing audio or analysis settings."
SectionHelp="Open help for %1"
HelpMeters="This monitor displays the loudness of the selected voice and BGM, and the mix calculated from them. Use it to check incoming levels and voice clarity before recording.<br><br>Measurements use 3-second Short-term LUFS. Values can differ from the recorded monitor because the measurement windows and audio processing differ."
HelpSettings="<b>VAD Threshold</b><br>The input level treated as voice; a lower value includes quieter speech and more background noise. Adjust this to detect speech in live input and recorded analysis.<br><br><b>Balance Target</b><br>The desired voice-to-BGM difference; a higher value asks for more prominent voice. Use this to match live and recorded balance evaluations to your intended sound.<br><br>Mix reference<br>The mix reference is a guide for rating the combined voice and BGM loudness. Use it to align the live and recorded monitor ratings with your intended level.<br><br>This plugin has no feature that automatically adjusts OBS volume. Record again to evaluate recorded audio with changed settings."

