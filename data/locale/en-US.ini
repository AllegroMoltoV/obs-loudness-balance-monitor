PreviewMonitorHelp="Normally leave this checked to prevent OBS monitoring from overlapping the preview. The previous state is restored after completion, stop, or error. Uncheck only to intentionally hear both. Streaming audio and external apps are not muted."
PreviewHelpDetail="<b>Check before streaming</b><br>1. Select an output device and press Record.<br>2. Recording starts after 3 seconds. Use your usual voice and BGM, then press Finish recording. The limit is 30 seconds.<br>3. Stop external audio and finish speaking or playing. Preview starts automatically after 3 seconds. If you need more time, press Stop automatic preview, prepare, and then press Preview.<br>4. Listen again replays the same audio. Record again replaces the previous recording.<br><br><b>Recorded audio</b><br>The track is normally selected from OBS streaming settings. To hear a different track, enable Listen to another track. Numbers match tracks 1–6 in Advanced Audio Properties. This is separate from source selection for the meters.<br><br><b>OBS monitoring</b><br>Normally keep Turn OFF OBS monitoring during preview checked. It prevents overlapping playback and restores the previous state after completion, stop, or error. Uncheck only to intentionally hear both. Streaming audio, external apps, and hardware direct monitoring are not muted.<br><br>Use this while streaming, recording, and the replay buffer are stopped. Meters always show live input. One recording is kept in memory and discarded when OBS closes. Selections are saved on normal shutdown."
SectionHelp="Open help for %1"
HelpMeters="<b>Live input</b><br>Shows loudness for voice, BGM, and their mix. LUFS estimates perceived loudness, dB shows peaks, and LU shows the voice-to-BGM difference. Voice and mix are evaluated while voice activity is detected.<br><br>These are not playback meters for your recording. They show the inputs selected in Source Selection, separately from the track used for recording and preview."
HelpSettings="<b>VAD Threshold</b><br>The input level treated as voice. A lower value detects quieter speech but may also include more background noise.<br><br><b>Balance Target</b><br>The desired loudness difference between voice and BGM. A higher value asks for more prominent voice.<br><br><b>Mix Preset</b><br>The reference used to judge overall loudness. These settings change the indicators; they do not automatically adjust OBS audio volume."
