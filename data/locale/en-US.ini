Help="Help"
HelpUsage="<b>Sources for the meters</b><br>Select your microphone as the voice source and check the BGM sources to monitor. Refresh Sources updates the list after sources are added.<br><br>This selection controls the status indicators and meters. Record and preview captures the final mix of an OBS audio track instead. Selections are saved on normal shutdown."
HelpBalance="<b>Balance</b><br>Compares the voice-to-BGM loudness difference with Balance Target. Green meets the target, yellow is below it, and red indicates that voice may be buried. Change the target in Settings."
HelpMix="<b>Mix</b><br>Compares the selected voice and BGM loudness with Mix Preset. Green meets the reference, yellow is slightly quiet, and red is too quiet. This evaluates live input, separately from the final-mix preview."
HelpClip="<b>Clip</b><br>Checks the peaks of the selected inputs. Green is below -1 dBFS, yellow is -1 to 0 dBFS, and red is 0 dBFS or higher. If red, lower the input level and check for distortion."

