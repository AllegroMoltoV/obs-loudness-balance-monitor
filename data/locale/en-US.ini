Help="Help"
HelpUsage="<b>Voice and BGM sources</b><br>Selected sources are used for live input meters and recorded voice/BGM analysis. To check the balance, select your microphone as Voice and check the BGM sources.<br><br><b>List and saved selections</b><br>Refresh Sources reloads the OBS source list, and selections are saved on normal shutdown. Refresh the list after adding a source.<br><br><b>Preview plays the final mix of the selected OBS track. Record again after changing the sources used for analysis.</b>"
HelpBalance="The balance rating compares the voice-to-BGM loudness difference with your target. Use it to check voice clarity.<br><br>Green means at or above the target, yellow means up to 3 LU below it, and red means a larger shortfall. Ratings for changing values use hysteresis to reduce frequent color changes."
HelpMix="The mix rating compares the loudness calculated from the selected voice and BGM with the Mix reference. Use it to check their combined level.<br><br>The recorded monitor combines only the selected voice and BGM. Other sources in the final mix you hear are not included in this rating."
HelpClip="The clip rating uses the highest peak among voice, BGM, and their mix to indicate excessive levels. Use it to check levels that may cause distortion.<br><br>Green means below −1 dBFS, yellow means at least −1 dBFS but below 0 dBFS, and red means at least 0 dBFS. The whole-recording rating uses the maximum peak, including periods without speech."

