PreviewAnalysisHelp="<b>Realtime</b><br>Shows Momentary LUFS over the 400 ms up to the playback position. Use this to compare what you hear with changes in voice and BGM loudness.<br><br><b>Average</b><br>The arithmetic mean of Short-term LUFS (loudness over the last 3 seconds) sampled every 100 ms at matching speech-active times with valid voice and BGM measurements. Use this to check voice and BGM balance across the recording.<br><br><b>Evaluation</b><br>Balance colors compare the difference with your target, rather than judging the absolute loudness of voice or BGM alone. Use realtime and average results to check voice clarity.<br><br><b>The average is not Integrated LUFS. Results are not rated when the required audio measurements are unavailable.</b>"
